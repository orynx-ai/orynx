name: Sync main to release

# The button for `git push origin main:release`. release moves only for admins (.github/rulesets), and a
# push made with the workflow's own token starts no workflow, so release moves with an admin's personal
# token, the RELEASE_TOKEN secret, and that push starts Release as any push does.
on:
  workflow_dispatch:

concurrency:
  group: sync-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Fast-forward release to main
    if: github.repository == 'orynx-ai/orynx' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # RELEASE_TOKEN is an admin's, so this keeps writers who can run workflows from releasing with it.
      - name: Only an admin moves release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_TRIGGERING_ACTOR/permission" --jq .permission)
          if [ "$permission" != admin ]; then
            echo "::error::$GITHUB_TRIGGERING_ACTOR has $permission here; only an admin moves release"
            exit 1
          fi
      - name: Move release to ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::No RELEASE_TOKEN secret: add an admin's token with Contents and Workflows read and write"
            exit 1
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/branches/release" --jq .commit.sha)" = "$GITHUB_SHA" ]; then
            echo "::notice::release is already at main ($GITHUB_SHA): nothing to release"
            exit 0
          fi
          # force=false: GitHub refuses anything but a fast-forward, and the ruleset wants CI passed on it.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release" -f sha="$GITHUB_SHA" -F force=false
