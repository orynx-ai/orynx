name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs these same checks before it builds the desktop app (spec 027).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces its old run. Each commit on main keeps its own run: release only
  # moves to a commit whose CI passed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every job runs on its own runner at the same time. Unit tests run one job per workspace package,
# each writing a vitest blob report; `unit-test-merge` joins them into one result and applies the
# coverage thresholds. `ci-passed` is the one check a PR needs.
jobs:
  checks:
    name: Gates and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The pull request targets main
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        run: |
          echo "::error::Open the pull request against main. release only fast-forwards to main: git push origin main:release"
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm gates --ci
      - run: pnpm format:check
      # The commit-msg hook can be skipped with --no-verify, so every commit a pull request brings is checked here too.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  unit-test:
    name: Unit tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One failing package must not cancel the others: the merge job reports every failure.
      fail-fast: false
      matrix:
        include:
          - { name: app, dir: packages/app }
          - { name: ui, dir: packages/ui }
          - { name: core, dir: packages/core }
          - { name: contracts, dir: packages/contracts }
          - { name: api-client, dir: packages/api-client }
          - { name: server, dir: apps/server }
          - { name: web, dir: apps/web }
          - { name: desktop, dir: apps/desktop }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Filter by folder, not --project: in vitest 5 a --project run records no coverage at all.
      # One package covers a small part of the code, so the thresholds wait for the merge job.
      - name: Test ${{ matrix.dir }}
        run: >-
          pnpm exec vitest run ${{ matrix.dir }}/
          --reporter=default --reporter=blob --outputFile.blob=.vitest/blob/blob-${{ matrix.name }}.json
          --coverage --coverage.reporter=json
          --coverage.thresholds.lines=0 --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
      # Vitest writes the blob even when a test fails. No blob means the run died before the end.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: vitest-blob-${{ matrix.name }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  unit-test-merge:
    name: Unit tests merge + coverage
    needs: unit-test
    # Runs after failures too, so it can list every failing test in one place.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: .vitest/blob/
          merge-multiple: true
      # A package left out of the matrix would lose its tests without a sound.
      - name: Every package sent a report
        run: |
          missing=()
          for config in packages/*/vitest.config.ts apps/*/vitest.config.ts; do
            name=$(basename "$(dirname "$config")")
            [ -f ".vitest/blob/blob-$name.json" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::No test report from ${missing[*]}. Its unit-test job died, or it is missing from the matrix in .github/workflows/ci.yml."
            exit 1
          fi
      - name: Merge reports and check coverage
        run: pnpm exec vitest --merge-reports --coverage

  build:
    name: Build and Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter @devhub/ui build-storybook

  # Advisory, not required (the user's call, 22 Oct 2026): a failing or slow e2e run warns and keeps its report, but
  # never fails CI, a pull request or a release. The step's own limit ends it before the job's, so a hang isn't a
  # cancelled job, which would still fail the run.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - id: e2e
        run: pnpm test:e2e
        timeout-minutes: 20
        continue-on-error: true
      - name: Say the e2e run failed
        if: steps.e2e.outcome != 'success'
        run: echo "::warning::The end-to-end run failed or ran out of time. It doesn't fail CI; its report is the playwright-report artifact."
      - uses: actions/upload-artifact@v7
        if: steps.e2e.outcome != 'success'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The one required check. It needs every job directly, so a failed package job fails it even
  # though the merge job ran. Add each new job here, except the advisory e2e job.
  ci-passed:
    name: CI passed
    if: always()
    needs: [checks, typecheck, lint, unit-test, unit-test-merge, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "A required job did not succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1
