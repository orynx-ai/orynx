name: Release

# A push to release builds the desktop app and publishes it as a GitHub Release (spec 027). release only
# ever moves to a commit on main: git push origin main:release. Run it by hand from any branch for a dry
# run, which builds both apps and publishes nothing. It runs only in orynx-ai/orynx, where the desktop
# app looks for updates, never in a fork.
on:
  push:
    branches: [release]
  workflow_dispatch:

# One release at a time, none cancelled: each push gets its own version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  on-main:
    name: The commit is on main
    if: github.repository == 'orynx-ai/orynx' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: release points at a commit on main
        run: |
          # Ensure we have the latest main ref so merge-base can compare against origin/main.
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release must point at a commit on main: git push origin main:release"
            exit 1
          fi

  checks:
    name: CI
    needs: on-main
    # A dry run from another branch skips the main check above.
    if: ${{ github.repository == 'orynx-ai/orynx' && !cancelled() && (needs.on-main.result == 'success' || needs.on-main.result == 'skipped') }}
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    strategy:
      matrix:
        include:
          - { name: macOS, os: macos-latest, target: --mac }
          - { name: Linux, os: ubuntu-latest, target: --linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Ad-hoc signing only (spec 027, Q12): never look for a signing identity in the runner's keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Stamp the version
        id: version
        run: echo "version=$(node --disable-warning=ExperimentalWarning scripts/release-version.ts ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
      - name: Pack Orynx ${{ steps.version.outputs.version }}
        run: |
          # Signing opens every file in the app at once (~30k, most in the hub's node_modules): EMFILE unless
          # both limits allow it. macOS caps a process at kern.maxfilesperproc whatever ulimit says.
          if [ "$RUNNER_OS" = macOS ]; then
            sudo sysctl -w kern.maxfiles=524288 kern.maxfilesperproc=524288
            ulimit -Sn 65536
          fi
          pnpm --filter @devhub/desktop package ${{ matrix.target }} --publish never
      - name: The packed app passes its e2e run
        if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install-deps chromium
          # Ubuntu 24.04 stops the user namespaces Electron's sandbox needs unless this is off.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm test:e2e:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: orynx-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish v${{ needs.build.outputs.version }}
    needs: build
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: orynx-*
          path: release
          merge-multiple: true
      # A re-run of a run that already published fails here: its tag is taken.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          gh release create "v$VERSION" release/*
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Orynx $VERSION" --generate-notes
