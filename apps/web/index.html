<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The server (or the Vite dev plugin) fills in the per-start session token. -->
    <meta name="devhub-token" content="" />
    <title>DevHub</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      try {
        var saved = JSON.parse(localStorage.getItem('devhub.theme') || '{}');
        var theme = saved && saved.state && saved.state.theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
